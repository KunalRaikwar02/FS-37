<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Student Registration Form</h1>

    <fieldset>
        <legend>
            Personal Information
        </legend>
        <label for="">Full Name:</label>
        <input type="text" placeholder="Enter your full name"><br><br>
        <label for="">Email:</label>
        <input type="email" placeholder="Enter your email"><br><br>
        <label for="">Password:</label>
        <input type="password"><br><br>
        <label for="">Date of Birth:</label>
        <input type="date"><br><br>
        <label for="">Phone Number:</label>
        <input type="tel" placeholder="Enter Phone number"><br><br>
        <label for="">Age:</label>
        <input size="5"  type="test">
    </fieldset>

    <br>

    <fieldset>
        <legend>
            Gender
        </legend>

        <input type="radio"> Male
        <input type="radio"> Female
        <input type="radio"> Female
    </fieldset>

    <br>

    <fieldset>
        <legend>Hobbies</legend>

        <input type="checkbox"> Reading<br>
        <input type="checkbox"> Sports<br>
        <input type="checkbox"> Music<br>
        <input type="checkbox"> Coding<br>
        <input type="checkbox"> Travelling<br>
    </fieldset>

    <br>

    <fieldset>
        <legend>Education Details</legend>
        <label for="">Highest Qualification:</label>
        <select id="options" name="options">
            <option value="" disabled selected>Please Select</option>
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select><br><br>

        <label for="">Branch / Subject:</label>
        <input type="text" placeholder="Enter your branch">
    </fieldset>

    <br>

    <fieldset>
        <legend>Technical Skills</legend>

        <input type="checkbox"> HTML 
        <input type="checkbox"> CSS 
        <input type="checkbox"> JavaScript
        <input type="checkbox"> Python 
        <input type="checkbox"> Java 
        <input type="checkbox"> C++
    </fieldset>

    <br>

    <fieldset>
        <legend>Location</legend>

        <label for="">Select Your City:</label>
        <select id="options" name="options">
            <option value="" disabled selected>Please Select</option>
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select>
    </fieldset><br>

    <fieldset>
        <legend>About Yourself</legend>
        Tell us something about yourself: <br> <br>

        <textarea rows="6" cols="45" name="" id="" placeholder="Write something about yourself..."></textarea>
    </fieldset>

    <fieldset>
        <legend>Additional Information</legend>

        <label for="">Upload Profile Photo:</label>
        <input type="file"><br><br>

        <label for="">Personal Website:</label>
        <input type="text" placeholder="https://example.com"><br><br>

        <label for="">Rate Your HTML Skills:</label>
        <input type="range"><br><br>

        <label for="">Favorite Color:</label>
        <input type="color">
    </fieldset><br>

        <input type="submit">
        <input type="reset">

</body>

</html>
