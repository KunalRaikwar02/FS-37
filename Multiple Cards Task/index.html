<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="top-heading">
             <h1>Choose Your Plan</h1>
        <p>Simple pricing for everyone</p>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Basic</h3>
                <h2 class="price">$9<span>/mo</span></h2>
                <div class="features">
                    <p>1 Website</p>
                    <p>5 GB Storage</p>
                    <p>Email Support</p>
                </div>
                <button>Choose Plan</button>
            </div>
    
            <div class="card pro">
                <h3>Pro</h3>
                <h2 class="price">$29<span>/mo</span></h2>
                <div class="features">
                    <p>10 Websites</p>
                    <p>50 GB Storage</p>
                    <p>Priority Support</p>
                </div>
                <button>Choose Plan</button>
            </div>

            <!-- Premium Plan -->
            <div class="card">
                <h3>Premium</h3>
                <h2 class="price">$59<span>/mo</span></h2>
                <div class="features">
                    <p>Unlimited Websites</p>
                    <p>500 GB Storage</p>
                    <p>24/7 Support</p>
                </div>
                <button>Choose Plan</button>
            </div>
        </div>
    </main>
</body>
</html>
